name: Publish release metadata

on:
  release:
    types: [published, edited]

permissions:
  contents: write

concurrency:
  group: release-metadata
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release metadata branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update manifest and changelog
        env:
          RELEASE_JSON: ${{ toJson(github.event.release) }}
        run: node scripts/update-release-metadata.mjs

      - name: Commit public metadata
        run: |
          if git diff --quiet -- manifests changelog CHANGELOG.md; then
            echo "No release metadata changes to publish."
          else
            git config user.name "tuffnode-release-bot"
            git config user.email "tuffnode-release-bot@users.noreply.github.com"
            git add manifests changelog CHANGELOG.md
            git commit -m "release: sync ${{ github.event.release.tag_name }} metadata"
            git push
          fi

      - name: Notify TuffNode.Web
        env:
          WEB_DISPATCH_TOKEN: ${{ secrets.TUFFNODE_WEB_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$WEB_DISPATCH_TOKEN" ]; then
            echo "TUFFNODE_WEB_DISPATCH_TOKEN is not configured; website polling remains the fallback."
            exit 0
          fi

          payload=$(jq -n \
            --arg tag "$RELEASE_TAG" \
            '{event_type:"tuffnode-public-release-updated",client_payload:{tag:$tag}}')

          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $WEB_DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dutu-dev/TuffNode.Web/dispatches \
            --data "$payload"
